name: Collect portfolio news

on:
  schedule:
    # 00:30 UTC = 06:00 Asia/Colombo (UTC+5:30). GitHub schedules in UTC only
    # and Sri Lanka has no daylight saving, so this holds at 06:00 year-round.
    # Scheduled runs are queued, not guaranteed on the minute, and GitHub
    # disables schedules in a repository with no activity for 60 days.
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "Search back to the project start date instead of the last few days"
        type: boolean
        default: false
      dry_run:
        description: "Fetch and report without writing or committing"
        type: boolean
        default: false

# Least privilege: the job pushes one data file and needs nothing else.
permissions:
  contents: write

# Two runs must never write the archive at once. A queued run waits rather
# than cancelling, so a manual backfill cannot be killed by the nightly cron.
concurrency:
  group: collect-news
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Both gates run before anything touches the network: a broken resolver
      # or a failing test should stop the run, not write a bad archive.
      - name: Validate the entity file
        run: python -m tools.build_entities --check

      - name: Run tests
        run: python tests/test_all.py

      - name: Collect
        id: collect
        # Budget is kept under the job timeout so the collector stops itself
        # and writes what it found, rather than being killed with nothing.
        run: |
          set -euo pipefail
          ARGS="--budget-minutes 30"
          if [ "${{ inputs.backfill }}" = "true" ]; then ARGS="$ARGS --backfill"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python -m tools.collect $ARGS

      - name: Commit the updated archive
        if: steps.collect.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/articles.json
          if git diff --cached --quiet; then
            echo "Collector reported a change but the file is identical; nothing to commit."
            exit 0
          fi
          git commit -m "News archive: ${{ steps.collect.outputs.new }} new, ${{ steps.collect.outputs.count }} held ($(date -u +%Y-%m-%d))"
          # The nightly cron and a manual run can finish close together, so
          # rebase onto whatever landed first instead of failing the push.
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "push rejected, rebasing (attempt $attempt)"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          done
          echo "could not push after 3 attempts" >&2
          exit 1

      - name: Report no change
        if: steps.collect.outputs.changed != 'true'
        run: echo "Status '${{ steps.collect.outputs.status }}' - archive untouched, no commit."
